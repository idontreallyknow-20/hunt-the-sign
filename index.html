<body>
<div class="app" id="app" data-screen="title" data-who="solo">
  <header class="bar gut">
    <button class="mark" data-act="home">Hunt the Sign</button>
    <div class="clock" id="clock" hidden>
      <button class="link" data-act="less" aria-label="Take 30 seconds off the clock">&minus;30</button>
      <output class="time" id="time" aria-label="Time left">5:00</output>
      <button class="link" data-act="more" aria-label="Add 30 seconds to the clock">+30</button>
      <button class="link" id="playBtn" data-act="clock">Start</button>
    </div>
    <button class="link" id="joinBtn" data-act="join" hidden>Join</button>
    <button class="link" id="notesBtn" data-act="notes" aria-pressed="false" hidden>Notes</button>
    <button class="link" id="setBtn" data-act="settings">Settings</button>
  </header>
  <aside class="notes gut" id="notes" aria-label="Presenter notes" hidden></aside>
  <main id="main"></main>
  <footer class="foot gut">
    <span>Wagamese, Richard. <i>Medicine Walk</i>. McClelland &amp; Stewart, 2014.</span>
    <span>Made with AI assistance (Claude)</span>
  </footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" hidden></aside>
<div class="join" id="join" role="dialog" aria-modal="true" aria-label="Join" hidden></div>
<noscript><p class="gut">Hunt the Sign needs JavaScript to run.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
